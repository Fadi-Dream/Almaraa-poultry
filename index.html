<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المرعى الريفي للدواجن</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8fc;--card:#fff;--bd:#e2e5f0;--inp:#f4f5fa;--txt:#1a1d2e;--mut:#667088;--acc:#c8790e;--grn:#27ae60;--red:#c0392b;--blu:#2980b9;--sh:0 2px 10px rgba(0,0,0,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f17;--card:#1a1d27;--bd:#2a2d3e;--inp:#12151e;--txt:#e8e9f0;--mut:#8b8fa8;--acc:#f5a623;--grn:#2ecc71;--red:#e74c3c;--blu:#3498db;--sh:0 2px 12px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0d0f17;--card:#1a1d27;--bd:#2a2d3e;--inp:#12151e;--txt:#e8e9f0;--mut:#8b8fa8;--acc:#f5a623;--grn:#2ecc71;--red:#e74c3c;--blu:#3498db;--sh:0 2px 12px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Tajawal','Cairo',sans-serif}
#app{max-width:520px;margin:0 auto;padding:0 14px 110px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
h2{font-size:20px;font-weight:900;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ct{font-size:11px;color:var(--mut);font-weight:700;display:block;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.box{background:var(--inp);border-radius:12px;padding:10px 6px;text-align:center}
.big{font-size:24px;font-weight:900}.k{text-align:center}.k b{display:block;font-size:24px;font-weight:900}
small{color:var(--mut);font-size:11px}
input,select{width:100%;background:var(--inp);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--txt);font:inherit;font-size:14px}
label{font-size:13px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.fg{margin-bottom:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;color:#fff;width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sm{width:auto;padding:6px 12px;font-size:12px;border-radius:8px}
.acc{background:var(--acc)}.grn{background:var(--grn)}.red{background:var(--red)}.blu{background:var(--blu)}
.out{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.tx-acc{color:var(--acc)}.tx-grn{color:var(--grn)}.tx-red{color:var(--red)}.tx-blu{color:var(--blu)}.mut{color:var(--mut)}
.w{background:var(--inp);color:var(--txt);border:1px solid var(--bd);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;font-weight:700;font-size:12px}
.w.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag{border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;background:var(--inp)}
.hi{background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:12px;padding:12px;margin-bottom:12px}
.warn{border-color:color-mix(in srgb,var(--red) 40%,transparent);background:color-mix(in srgb,var(--red) 10%,transparent)}
.item{border-bottom:1px solid var(--bd);padding:10px 0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:8px 2px 6px;font-size:10px;font-weight:600;position:relative}
nav button.on{color:var(--acc);font-weight:800}nav button span{display:block;font-size:20px}
nav i{position:absolute;top:2px;left:50%;margin-left:6px;background:var(--red);color:#fff;border-radius:8px;padding:0 5px;font-size:9px;font-style:normal}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.mx{background:var(--card);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;font-size:13px;z-index:100;display:none}
.bar{background:var(--bd);border-radius:4px;height:6px;overflow:hidden}.bar div{height:100%}
.chk{display:flex;gap:10px;align-items:center;padding:12px;background:var(--inp);border-radius:10px;margin-bottom:14px;color:var(--acc);font-weight:600;font-size:14px}
.chk input{width:auto}
.dsk{display:none}
.tb{width:auto;background:var(--inp);color:var(--txt);padding:6px 10px;font-size:14px;border-radius:8px}
@media(min-width:900px){
#app{max-width:none;margin:0;margin-inline-start:240px;padding:0 32px 40px}
#app>*:not(nav):not(.mb){max-width:1100px}
nav{top:0;bottom:0;left:auto;right:auto;inset-inline-start:0;transform:none;width:240px;max-width:none;flex-direction:column;border-top:0;border-inline-end:1px solid var(--bd);padding:20px 0;justify-content:flex-start}
nav button{flex:none;display:flex;align-items:center;gap:12px;padding:12px 20px;font-size:14px;text-align:start}
nav button span{display:inline;font-size:18px}
nav i{position:static;margin-inline-start:auto;margin-left:0}
.dsk{display:flex}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.mb{align-items:center}.mx{border-radius:20px}
}
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"></div>
<script>
const W=[800,900,1000],PER=10,DEP=5,K='almaraa_v4_';
const tk=()=>new Date().toISOString().slice(0,10);
const ld=(k,d)=>{try{const v=localStorage.getItem(K+k);return v?JSON.parse(v):d}catch{return d}};
const sv=()=>{try{localStorage.setItem(K+'day',JSON.stringify(day));localStorage.setItem(K+'archive',JSON.stringify(arch));localStorage.setItem(K+'debts',JSON.stringify(debts))}catch{}};
const emptyDay=()=>({date:tk(),open:{800:0,900:0,1000:0},stock:{800:0,900:0,1000:0},purchases:[],prices:{sell:{800:18,900:20,1000:22},buy:{800:14,900:16,1000:18}},sales:[],baskets:[],agentInv:[],agentExp:[],agentCash:'',started:false});
let day=ld('day',null);if(!day||day.date!==tk())day=emptyDay();day.agentInv=day.agentInv||[];day.agentExp=day.agentExp||[];if(day.agentCash==null)day.agentCash='';
let arch=ld('archive',[]),debts=ld('debts',{});
let scr='home',modal=null,dsel=null,payAmt='',payNote='',md={n:'',a:'',note:''},np={w:800,qty:'',cpu:''};
const f=n=>Number(n||0).toLocaleString(LC());
const rev=d=>d.sales.reduce((s,x)=>s+x.total,0);
const cost=d=>(d.purchases||[]).reduce((s,p)=>s+p.qty*p.cpu,0);
const prof=d=>rev(d)-cost(d);
const units=d=>d.sales.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0);
const dl=d=>new Date(d+'T12:00:00').toLocaleDateString(LC(),{weekday:'short',month:'numeric',day:'numeric'});
const ml=m=>new Date(m+'-01T12:00:00').toLocaleDateString(LC(),{month:'long',year:'numeric'});
const pm=x=>x==='cash'?'كاش':x==='deferred'?'آجل':'شبكة';
const pc=x=>x==='cash'?'grn':x==='deferred'?'red':'blu';
const bal=e=>e.amount-e.payments.reduce((s,p)=>s+p.amount,0);
const rb=n=>debts[n].entries.reduce((s,e)=>s+bal(e),0);
const owing=()=>Object.keys(debts).filter(n=>rb(n)>0);
const pending=()=>day.baskets.reduce((s,b)=>s+b.taken-b.ret,0);
function tst(m,err){const t=document.getElementById('toast');t.textContent=T(m);t.style.background=err?'var(--red)':'var(--grn)';t.style.display='block';clearTimeout(tst.h);tst.h=setTimeout(()=>t.style.display='none',3000)}
function theme(){const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0d0f17';r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('almaraa_theme',r.dataset.theme)}catch{}}
try{const t=localStorage.getItem('almaraa_theme');if(t)document.documentElement.dataset.theme=t}catch{}

/* sale form */
function newSale(){return{cust:'',items:[{w:800,qty:'',price:day.prices.sell[800]}],pay:'cash',ret:0,dep:false}}
let sale=newSale();
function totHTML(){const q=sale.items.reduce((s,i)=>s+(+i.qty||0),0),t=sale.items.reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0),b=Math.ceil(q/PER),r=b-(+sale.ret||0);
return q?`<div class="hi row"><span class="mut">${q} دجاجة = ${b} سلة</span><b class="tx-acc" style="font-size:18px">${f(t)} ر.س</b></div>${r>0?`<label class="chk"><input type="checkbox" ${sale.dep?'checked':''} onchange="sale.dep=this.checked"> دفع تأمين ${DEP} ريال لكل سلة متبقية (${r*DEP} ر.س)</label>`:''}`:''}
const upd=()=>{const e=document.getElementById('tot');e.innerHTML=totHTML();trNode(e)};
function setW(i,w){sale.items[i].w=w;sale.items[i].price=day.prices.sell[w];R()}
function rec(){
 if(!sale.cust.trim())return tst('أدخل اسم الزبون',1);
 const v=sale.items.filter(i=>+i.qty>0);if(!v.length)return tst('أدخل كمية واحدة على الأقل',1);
 const need={};v.forEach(i=>need[i.w]=(need[i.w]||0)+ +i.qty);
 for(const w in need)if(need[w]>day.stock[w])return tst(`الكمية ${w}g تتجاوز رصيد الثلاجة (${day.stock[w]})`,1);
 const items=v.map(i=>({w:i.w,qty:+i.qty,price:+i.price,sub:i.qty*i.price}));
 const q=items.reduce((s,i)=>s+i.qty,0),total=items.reduce((s,i)=>s+i.sub,0),b=Math.ceil(q/PER),id=Date.now();
 const s={id,cust:sale.cust.trim(),items,total,baskets:b,ret:+sale.ret||0,dep:sale.dep,pay:sale.pay,time:new Date().toLocaleTimeString(LC(),{hour:'2-digit',minute:'2-digit'})};
 items.forEach(i=>day.stock[i.w]-=i.qty);
 day.sales.unshift(s);day.baskets.push({id,cust:s.cust,taken:b,ret:s.ret,dep:s.dep});
 if(s.pay==='deferred')addDebt(s.cust,total,'فاتورة #'+String(id).slice(-4),'أجل بتاريخ '+tk());
 sale=newSale();modal={t:'inv',s};sv();tst(`تم تسجيل بيع ${q} دجاجة بـ ${f(total)} ر.س`);R();
}
function delSale(id){if(!cf('حذف هذه الفاتورة؟'))return;const s=day.sales.find(x=>x.id===id);s.items.forEach(i=>day.stock[i.w]+=i.qty);day.sales=day.sales.filter(x=>x.id!==id);day.baskets=day.baskets.filter(b=>b.id!==id);sv();tst('تم حذف البيع وإعادة المخزون');R()}
function retB(id,n){const b=day.baskets.find(x=>x.id===id);b.ret+=n;sv();tst(`تم تسجيل إرجاع ${n} سلة`);R()}
function addP(){if(!np.qty||!np.cpu)return tst('أدخل الكمية والتكلفة',1);const p={id:Date.now(),w:np.w,qty:+np.qty,cpu:+np.cpu};day.purchases.push(p);day.stock[p.w]+=p.qty;np={w:np.w,qty:'',cpu:''};sv();tst(`أضيف ${p.qty} دجاجة للرصيد`);R()}
function delP(id){const p=day.purchases.find(x=>x.id===id);day.stock[p.w]=Math.max(0,day.stock[p.w]-p.qty);day.purchases=day.purchases.filter(x=>x.id!==id);sv();R()}
function addDebt(name,amount,ref,note){name=name.trim();if(!name||!amount)return;(debts[name]=debts[name]||{entries:[]}).entries.push({id:Date.now(),date:tk(),ref,amount:+amount,note,payments:[]})}
function pay(){const e=debts[dsel].entries.find(x=>x.id===modal.id),a=+payAmt;if(!a||a<=0)return tst('أدخل مبلغاً صحيحاً',1);if(a>bal(e))return tst(`المبلغ أكبر من المتبقي (${f(bal(e))})`,1);e.payments.push({date:tk(),amount:a,note:payNote});modal=null;payAmt=payNote='';sv();tst('تم تسجيل الدفعة');R()}
function payFull(id){const e=debts[dsel].entries.find(x=>x.id===id);e.payments.push({date:tk(),amount:bal(e),note:'سداد كامل'});sv();tst('تم تسجيل الدفعة');R()}
function delE(id){if(!cf('حذف هذا القيد؟'))return;debts[dsel].entries=debts[dsel].entries.filter(x=>x.id!==id);if(!debts[dsel].entries.length){delete debts[dsel];dsel=null}sv();tst('تم حذف القيد');R()}
function endDay(){if(!cf('تأكيد إنهاء اليوم وأرشفته؟'))return;arch=arch.filter(d=>d.date!==day.date);arch.push({...day,final:{...day.stock}});const n=emptyDay();n.open={...day.stock};n.prices=JSON.parse(JSON.stringify(day.prices));day=n;sale=newSale();scr='home';sv();tst('تم إنهاء اليوم وحفظه في الأرشيف');R()}
function go(s){scr=s;if(s!=='debts')dsel=null;R();scrollTo(0,0)}

/* views */
const kpi=(t,v,c,u)=>`<div class="card k"><small>${t}</small><b class="${c}">${v}</b><small>${u}</small></div>`;
const head=(t,back)=>`<div class="row" style="justify-content:flex-start;gap:10px"><button class="sm out" onclick="${back||"go('home')"}">← رجوع</button><h2 style="margin:0">${t}</h2></div><div style="height:12px"></div>`;
const wRow=(cur,fn,extra)=>`<div class="g3">${W.map(w=>`<div class="w ${cur===w?'on':''}" onclick="${fn}(${w})">${w}g${extra?`<div style="font-size:9px;opacity:.7">${day.stock[w]} متاح</div>`:''}</div>`).join('')}</div>`;

function startV(){return`<header><span></span><button class="tb" onclick="setLang()">${lang==='ar'?'EN':'ع'}</button><button class="tb" onclick="theme()">🌓</button></header>
<div style="text-align:center;margin-bottom:24px"><div style="font-size:52px">🐔</div><h2 class="tx-acc" style="font-size:26px;margin:4px 0">المرعى الريفي للدواجن</h2><small>لوحة التشغيل اليومي</small></div>
<div class="card"><span class="ct">رصيد الثلاجة - بداية اليوم</span>${W.map(w=>`<div class="fg"><label>عدد الدجاجات وزن ${w}g</label><input type="number" inputmode="numeric" value="${day.open[w]||''}" oninput="day.open[${w}]=+this.value"></div>`).join('')}</div>
<div class="card"><span class="ct">أسعار اليوم (بالحبة)</span>${W.map(w=>`<div style="margin-bottom:14px"><b class="tx-acc">وزن ${w} جرام</b><div class="g2" style="margin-top:8px"><div><label>سعر البيع</label><input type="number" value="${day.prices.sell[w]}" oninput="day.prices.sell[${w}]=+this.value"></div><div><label>سعر الشراء</label><input type="number" value="${day.prices.buy[w]}" oninput="day.prices.buy[${w}]=+this.value"></div></div></div>`).join('')}</div>
<button class="grn" onclick="day.stock={...day.open};day.started=true;sale=newSale();sv();R()">ابدأ اليوم 🚀</button>`}

function homeV(){const od=owing(),dt=od.reduce((s,n)=>s+rb(n),0),pb=pending();return`<h2>لوحة اليوم</h2>
<div class="g3" style="gap:8px">${kpi('المبيعات',f(rev(day)),'tx-acc','ر.س')}${kpi('الربح',f(prof(day)),'tx-grn','ر.س')}${kpi('الفواتير',day.sales.length,'tx-blu','اليوم')}</div>
<div class="cols"><div><div class="card"><div class="row"><span class="ct" style="margin:0">رصيد الثلاجة</span><button class="sm blu" onclick="modal={t:'stock'};R()">تعديل</button></div><div class="g3">${W.map(w=>`<div class="box"><small>${w}g</small><div class="big ${day.stock[w]<50?'tx-red':''}">${day.stock[w]}</div><small>دجاجة</small><div class="tx-acc" style="font-size:10px;font-weight:700">${day.prices.sell[w]} ر.س</div></div>`).join('')}</div></div>
<div class="g2" style="margin-bottom:10px"><button class="out" onclick="modal={t:'prices'};R()">الأسعار</button><button class="out" onclick="go('buy')">استلام</button></div>
<button class="acc" style="margin-bottom:10px" onclick="go('sale')">+ تسجيل بيع جديد</button>
<div class="g2" style="margin-bottom:12px"><button class="out" onclick="go('settle')">تسوية المندوب</button><button class="out" onclick="go('report')">تقرير اليوم</button></div>
${pb>0?`<div class="card hi" onclick="go('baskets')"><b class="tx-acc">🧺 سلال معلقة عند الزبائن</b><br><small>${pb} سلة لم تسترجع</small></div>`:''}
${dt>0?`<div class="card hi warn" onclick="go('debts')"><b class="tx-red">📒 مديونيات المطاعم</b><br><small>${od.length} مطعم مدين - الإجمالي: ${f(dt)} ر.س</small></div>`:''}
</div><div>${day.sales.length?`<div class="card"><span class="ct">آخر المبيعات</span>${day.sales.slice(0,6).map(s=>`<div class="item"><div class="row" style="margin:0"><div><b>${s.cust}</b><br><small>${s.items.map(i=>i.qty+'×'+i.w+'g').join(' | ')}</small></div><div style="text-align:end"><b class="tx-acc">${f(s.total)} ر.س</b><br><span class="tag tx-${pc(s.pay)}">${pm(s.pay)}</span></div></div><div style="display:flex;gap:6px;margin-top:7px"><button class="sm blu" onclick="modal={t:'inv',s:day.sales.find(x=>x.id==${s.id})};R()">فاتورة</button><button class="sm red" onclick="delSale(${s.id})">حذف</button></div></div>`).join('')}</div>`:''}</div></div>`}

function saleV(){return`${head('تسجيل بيع')}<div class="card">
<div class="fg"><label>اسم الزبون</label><input type="text" placeholder="مثال: أبو محمد" value="${sale.cust.replace(/"/g,'&quot;')}" oninput="sale.cust=this.value"></div>
${sale.items.map((it,i)=>`<div class="box" style="text-align:start;margin-bottom:10px;padding:12px"><div class="row"><b class="tx-acc" style="font-size:13px">صنف #${i+1}</b>${sale.items.length>1?`<button class="sm red" onclick="sale.items.splice(${i},1);R()">حذف</button>`:''}</div>
${wRow(it.w,`setW.bind(0,${i})`,1).replace(/setW\.bind\(0,(\d+)\)\((\d+)\)/g,'setW($1,$2)')}
<div class="g2" style="margin-top:10px"><div><label>العدد (حبة)</label><input type="number" inputmode="numeric" placeholder="0" value="${it.qty}" oninput="sale.items[${i}].qty=this.value;upd()"></div><div><label>السعر / حبة</label><input type="number" value="${it.price}" oninput="sale.items[${i}].price=this.value;upd()"></div></div></div>`).join('')}
<button class="sm blu" style="width:100%;padding:10px;margin-bottom:12px" onclick="sale.items.push({w:800,qty:'',price:day.prices.sell[800]});R()">+ إضافة صنف آخر</button>
<div id="tot">${totHTML()}</div>
<div class="fg"><label>طريقة الدفع</label><div class="g3">${['cash','network','deferred'].map(p=>`<div class="w ${sale.pay===p?'on':''}" onclick="sale.pay='${p}';R()">${pm(p)}</div>`).join('')}</div>${sale.pay==='deferred'?'<small class="tx-red" style="display:block;margin-top:8px">سيتم ترحيل الفاتورة تلقائياً إلى دفتر الديون</small>':''}</div>
<div class="fg"><label>سلال معادة فوراً</label><input type="number" placeholder="0" value="${sale.ret||''}" oninput="sale.ret=this.value;upd()"></div>
<button class="grn" onclick="rec()">تأكيد البيع وعرض الفاتورة</button></div>`}

function buyV(){const t=day.purchases.reduce((s,p)=>s+p.qty*p.cpu,0);return`${head('استلام من المسلخ')}<div class="card"><span class="ct">إضافة استلام</span>${wRow(np.w,'(w=>{np.w=w;R()})')}
<div class="g2" style="margin-top:12px"><div><label>عدد الدجاجات</label><input type="number" value="${np.qty}" oninput="np.qty=this.value"></div><div><label>تكلفة الحبة (ريال)</label><input type="number" value="${np.cpu}" oninput="np.cpu=this.value"></div></div>
<button class="acc" style="margin-top:12px" onclick="addP()">+ إضافة للمخزون</button></div>
